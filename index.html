<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="application-name" content="My glass calculator">

    <meta property="og:site_name" content="My glass calculator">
    <meta property="og:type" content="website">
    <meta property="og:title" content="My cool glass calculator">
    <meta property="og:description" content="Make simple calculations using a stylish custom calculator in a glassmorphic UI, Solve simple arithmetics and just flex the fucking UI. Enjoy">
    <meta property="og:url" content="https://my-cool-glass-calculator.vercel.app">

    <meta property="og:image" content="https://my-cool-glass-calculator.vercel.app/calculator-og-img-v2.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">

    <meta name="twitter:image" content="https://my-cool-glass-calculator.vercel.app/calculator-og-img-v2.jpg">
    <meta name="twitter:title" content="My cool glass calculator">
    <meta name="twitter:description" content="Make simple calculations using a stylish custom calculator in a glassmorphic UI, Solve simple arithmetics and just flex the fucking UI. Enjoy">

    <link rel="icon" href="calculator-og-img-v2.jpg">
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url(background.svg);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        #display {
            padding-right: 10px;
            text-align: right;
            font-size: 2rem;
            color: white;
            border: none;
            outline: none;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(2px);
        }

        .calculator {
            background-color: aliceblue;
            border-radius: 10px;
            overflow: hidden;

            display: grid;
            grid-template-columns: 300px;
            grid-template-rows: 160px;

            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(10px);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.35);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 70px;
            overflow: hidden;
        }

        .clear {
            grid-column: 1 / 3;
            background: rgba(255, 255, 255, 0.2) !important;
        }

        .equals {
            background: rgba(255, 255, 255, 0.2) !important;
        }

        .buttons button {
            font-size: 1.3rem;
            color: white;
            border: 0.5px solid rgba(255, 255, 255, 0.03);

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(2px);

            transition: 0.2s ease-out;

        }

        .buttons button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .buttons button:active {
            opacity: 20%;
        }

        #plus-btn {
            grid-column: 4;
            grid-row: 3 / 5;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input id="display" readonly>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="inputButtons('/')">/</button>
            <button class="operator" onclick="inputButtons('*')">×</button>


            <button onclick="inputButtons('7')">7</button>
            <button onclick="inputButtons('8')">8</button>
            <button onclick="inputButtons('9')">9</button>
            <button class="operator" onclick="inputButtons('-')">-</button>
            <button id="plus-btn" class="operator" onclick="inputButtons('+')">+</button>

            <button onclick="inputButtons('4')">4</button>
            <button onclick="inputButtons('5')">5</button>
            <button onclick="inputButtons('6')">6</button>


            <button onclick="inputButtons('1')">1</button>
            <button onclick="inputButtons('2')">2</button>
            <button onclick="inputButtons('3')">3</button>


            <button class="zero" onclick="inputButtons('0')">0</button>
            <button onclick="inputButtons('00')">00</button>
            <button onclick="inputButtons('.')">.</button>

            <button class="equals" onclick="calculate()">=</button>

        </div>
    </div>

    <script>
        const display = document.getElementById("display");
        let currentNumber = "";
        let operator = null;
        let firstNumber = null;
        let secondNumber = null;
        let finalNumber = null;
        let justCalculated = false;

        function inputButtons(input) {

            if (input >= "0" && input <= "9" || input === ".") {

                if (justCalculated === true) {
                    currentNumber = "";
                    operator = null;
                    firstNumber = null;
                    finalNumber = null;
                    secondNumber = null;
                    justCalculated = false;
                }

                if (operator === null) {
                    currentNumber += input;
                    display.value = currentNumber;
                } else {
                    currentNumber += input;
                    display.value = firstNumber + " " + operator + " " + currentNumber;
                }

            }

            if (input === "+" || input === "-" || input === "*" || input === "/") {
                if (operator !== null && currentNumber !== "") {
                    calculate();
                }
                if (justCalculated === true) {
                    firstNumber = finalNumber;
                    finalNumber = null;
                    secondNumber = null;
                    currentNumber = "";
                    justCalculated = false;
                    operator = input;
                    display.value = firstNumber + " " + operator;
                } 
                if (operator !== null && currentNumber === "") {
                    operator = input;
                    display.value = firstNumber + " " + operator;
                } 
                else if (operator === null && currentNumber !== ""){
                    operator = input;
                    firstNumber = Number(currentNumber);

                    if (isNaN(firstNumber)) {
                        firstNumber = currentNumber;
                    }
                    
                    currentNumber = "";
                    display.value = firstNumber + " " + operator;
                }
            }
        }

        function clearDisplay() {
            display.value = "";
            currentNumber = "";
            firstNumber = null;
            secondNumber = null;
            operator = null;
            finalNumber = null;
            justCalculated = false;
        }

        function calculate() {
            secondNumber = Number(currentNumber);

            try {
                switch (operator) {
                    case "+":
                        finalNumber = firstNumber + secondNumber;
                        break;

                    case "-":
                        finalNumber = firstNumber - secondNumber;
                        break;

                    case "*":
                        finalNumber = firstNumber * secondNumber;
                        break;

                    case "/":
                        finalNumber = firstNumber / secondNumber;
                        break;
                }
                if (isNaN(finalNumber)) {
                    throw new Error("Syntax Error");
                }

                display.value = finalNumber;
                justCalculated = true;

                console.log("first:", firstNumber);
                console.log("operator:", operator);
                console.log("current:", currentNumber);
            }

            catch (error) {
                display.value = error.message;
            }
        }
    </script>

</body>

</html>
